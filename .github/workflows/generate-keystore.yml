name: Generate Android Keystore

# Run manually from the Actions tab (one-time only)
on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore align-with-enjy.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias alignwithenjy \
            -storepass "AlignEnjy2026!" \
            -keypass "AlignEnjy2026!" \
            -dname "CN=Enjy Gebril, OU=Mobile, O=Align with Enjy, L=Cairo, ST=Cairo, C=EG"

      - name: Print keystore as base64
        run: |
          echo "=================================================="
          echo "COPY EVERYTHING BETWEEN THE LINES BELOW (CM_KEYSTORE)"
          echo "=================================================="
          base64 -w 0 align-with-enjy.jks
          echo ""
          echo "=================================================="
          echo "KEYSTORE PASSWORD : AlignEnjy2026!"
          echo "KEY ALIAS         : alignwithenjy"
          echo "KEY PASSWORD      : AlignEnjy2026!"
          echo "=================================================="

      - name: Upload keystore file (backup)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-BACKUP
          path: align-with-enjy.jks
          retention-days: 7

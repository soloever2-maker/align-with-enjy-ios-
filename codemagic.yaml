# Codemagic build config — builds iOS and Android in the cloud (no Mac/PC needed)

workflows:

  # ──────────────────────────────────────────────
  # iOS App Store (unchanged)
  # ──────────────────────────────────────────────
  ios-appstore:
    name: Align with Enjy — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic API Key"
    environment:
      groups:
        - ios_signing_credentials
      vars:
        BUNDLE_ID: "com.alignwithenjy.app"
        XCODE_SCHEME: "App"
        APP_APPLE_ID: "6789882055"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.alignwithenjy.app" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST → New build number: $BUILD_NUMBER"
          # Bump the build number (CFBundleVersion).
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          # Bump the marketing version (CFBundleShortVersionString) to 1.0.<build>
          # so every upload has a strictly-higher version than the last approved one.
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 1.0.$BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Versions set:"
          grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION" ios/App/App.xcodeproj/project.pbxproj | head -4
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ──────────────────────────────────────────────
  # Android Play Store (NEW)
  # ──────────────────────────────────────────────
  android-playstore:
    name: Align with Enjy — Android Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_signing   # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        - android_firebase  # GOOGLE_SERVICES_JSON (base64)
        - google_play       # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (service-account JSON)
      vars:
        PACKAGE_NAME: "com.alignwithenjy.app"
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install

      - name: Add Android platform (first time only)
        script: |
          if [ ! -d "android" ]; then
            echo "android/ not found — running cap add android"
            npx cap add android
          else
            echo "android/ already exists — skipping cap add"
          fi

      - name: Capacitor sync
        script: npx cap sync android

      - name: Add biometric permission to AndroidManifest
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.USE_BIOMETRIC" "$MANIFEST"; then
            # Insert the permission right after the opening <manifest ...> tag
            sed -i '' 's#\(<manifest[^>]*>\)#\1\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />#' "$MANIFEST"
            echo "USE_BIOMETRIC permission added ✓"
          else
            echo "USE_BIOMETRIC already present — skipping"
          fi

      - name: Inject google-services.json (FCM / Push Notifications)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json injected ✓"
          else
            echo "ERROR: GOOGLE_SERVICES_JSON not set — Android push will not build"
            exit 1
          fi

      - name: Enable Google Services Gradle plugin
        script: |
          # Project-level build.gradle: add the classpath if missing
          PROJ=android/build.gradle
          if ! grep -q "com.google.gms:google-services" "$PROJ"; then
            # Insert the classpath inside the buildscript { dependencies { } } block
            sed -i '' "s#\(classpath 'com.android.tools.build:gradle.*\)#\1\n        classpath 'com.google.gms:google-services:4.4.2'#" "$PROJ"
            echo "Added google-services classpath ✓"
          fi

          # App-level build.gradle: apply the plugin at the very top-level (end of file is fine)
          APP=android/app/build.gradle
          if ! grep -q "com.google.gms.google-services" "$APP"; then
            echo "" >> "$APP"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP"
            echo "Applied google-services plugin ✓"
          fi

      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/keystore.jks

      - name: Set version code from Google Play (always correct)
        script: |
          # Ask Google Play for the highest versionCode already uploaded across
          # ALL tracks, then use +1. This is bulletproof: the versionCode can
          # never collide, no matter how many builds ran before.
          set -e
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud_sa.json
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @file:/tmp/gcloud_sa.json 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No existing build found on Play — starting from PROJECT_BUILD_NUMBER"
            VC=${PROJECT_BUILD_NUMBER:-1}
          else
            VC=$((LATEST + 1))
          fi
          echo "versionCode → $VC"
          sed -i '' "s/versionCode .*/versionCode $VC/" android/app/build.gradle

      - name: Build Android AAB (release)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal          # نشر تلقائي على Internal Testing
        submit_as_draft: false   # ينزل مباشرة للمختبرين (مش draft)
